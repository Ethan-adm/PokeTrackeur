<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCGP Tracker - Éditeur de Deck</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-purple-900 to-slate-900 text-white min-h-screen flex flex-col font-sans">
    
    <nav class="bg-black/30 backdrop-blur-md p-4 flex justify-between items-center border-b border-white/10 shadow-[0_4px_30px_rgba(0,0,0,0.1)]">
        <div class="flex items-center gap-3">
            <div class="w-3 h-3 rounded-full bg-purple-500 shadow-[0_0_10px_#a855f7]"></div>
            <h1 class="font-black text-2xl tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-fuchsia-400 to-purple-600">ÉDITEUR DE DECK</h1>
        </div>
        <div class="flex gap-4">
            <a href="index.html" class="bg-white/5 hover:bg-white/10 border border-white/10 px-5 py-2 rounded-lg font-bold transition">Retour au Tracker</a>
        </div>
    </nav>

    <div class="flex max-w-[1600px] w-full mx-auto gap-6 p-6 h-[calc(100vh-80px)]">
        
        <!-- CATALOGUE COMPLET -->
        <div class="flex-[3] bg-black/40 backdrop-blur-xl shadow-2xl rounded-2xl p-5 flex flex-col border border-white/10 h-full relative">
            <h2 class="text-sm font-bold text-slate-300 uppercase tracking-widest mb-4 border-b border-white/10 pb-3">Toutes les cartes <span class="text-xs text-slate-500 normal-case">(Cliquez pour ajouter)</span></h2>
            
            <!-- Le conteneur du catalogue -->
            <div class="grid grid-cols-4 md:grid-cols-6 lg:grid-cols-8 gap-4 overflow-y-auto p-2 content-start custom-scrollbar h-full" id="builder-catalog">
                <!-- Message de chargement qui disparaîtra tout seul -->
                <div class="col-span-full flex flex-col items-center justify-center py-20 text-fuchsia-400 animate-pulse">
                    <svg class="w-12 h-12 mb-4 animate-spin" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
                    <p class="font-bold tracking-widest uppercase">Connexion à la base de données...</p>
                </div>
            </div>
        </div>

        <!-- DECK EN CONSTRUCTION -->
        <div class="flex-1 bg-black/40 backdrop-blur-xl shadow-2xl rounded-2xl p-5 flex flex-col border border-white/10 h-full">
            <div class="flex justify-between items-center border-b border-white/10 pb-3 mb-4">
                <h2 class="text-sm font-bold text-slate-300 uppercase tracking-widest">Mon Deck</h2>
                <span class="font-bold text-fuchsia-400 bg-fuchsia-900/30 border border-fuchsia-500/30 px-3 py-1 rounded-full text-xs" id="builder-deck-count">0 / 20</span>
            </div>
            <div class="grid grid-cols-3 xl:grid-cols-4 gap-2 overflow-y-auto p-2 flex-1 content-start custom-scrollbar" id="builder-deck-container">
                <!-- Images injectées par JS -->
            </div>
            <div class="mt-4 pt-4 border-t border-white/10">
                <button onclick="clearDeck()" class="bg-rose-500/20 text-rose-400 border border-rose-500/30 px-4 py-3 rounded-xl font-bold hover:bg-rose-500 hover:text-white w-full transition-all uppercase tracking-widest text-sm">Vider le deck</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
