<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCGP Tracker - Éditeur de Deck</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col font-sans">
    
    <!-- Barre de Navigation -->
    <nav class="bg-slate-800 p-4 shadow-lg flex justify-between items-center border-b border-slate-700">
        <h1 class="font-bold text-xl text-purple-400">Éditeur de Deck</h1>
        <div class="flex gap-4">
            <a href="index.html" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded font-bold transition">Retour au Tracker</a>
        </div>
    </nav>

    <div class="flex max-w-[1400px] w-full mx-auto gap-6 p-6 h-[calc(100vh-80px)]">
        
        <!-- CATALOGUE COMPLET -->
        <div class="flex-[2] bg-slate-800 shadow-xl rounded-lg p-4 flex flex-col border border-slate-700 h-full">
            <h2 class="text-lg font-bold text-slate-200 mb-4 border-b border-slate-700 pb-2">Toutes les cartes (Cliquez pour ajouter)</h2>
            <div class="grid grid-cols-4 md:grid-cols-6 lg:grid-cols-8 gap-3 overflow-y-auto p-2" id="builder-catalog">
                <!-- Images injectées par JS -->
            </div>
        </div>

        <!-- DECK EN CONSTRUCTION -->
        <div class="flex-1 bg-slate-800 shadow-xl rounded-lg p-4 flex flex-col border border-slate-700 h-full">
            <div class="flex justify-between items-center border-b border-slate-700 pb-2 mb-4">
                <h2 class="text-lg font-bold text-slate-200">Mon Deck</h2>
                <span class="font-bold text-purple-400 bg-slate-900 px-3 py-1 rounded" id="builder-deck-count">0 / 20</span>
            </div>
            <div class="grid grid-cols-4 gap-2 overflow-y-auto p-2 flex-1 content-start" id="builder-deck-container">
                <!-- Images injectées par JS -->
            </div>
            <div class="mt-4 pt-4 border-t border-slate-700 flex justify-between">
                <button onclick="clearDeck()" class="bg-red-900 text-red-200 px-4 py-2 rounded font-bold hover:bg-red-800 w-full transition">Vider le deck</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
