<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCGP Tracker - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-900 text-white h-screen flex flex-col font-sans overflow-hidden">
    
    <!-- Barre de Navigation -->
    <nav class="bg-slate-800 p-4 shadow-lg flex justify-between items-center border-b border-slate-700">
        <h1 class="font-bold text-xl text-purple-400">Pokémon TCGP Tracker</h1>
        <div class="flex gap-4">
            <a href="index.html" class="bg-purple-600 hover:bg-purple-700 px-4 py-2 rounded font-bold transition">Tracker</a>
            <a href="deck.html" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded font-bold transition">Éditeur de Deck</a>
        </div>
    </nav>

    <div class="flex justify-between h-full max-w-[1600px] w-full mx-auto gap-4 p-4">
        
        <!-- PANNEAU GAUCHE : Graphique & Historique -->
        <div class="w-80 bg-slate-800 shadow-xl rounded-lg p-4 flex flex-col gap-4 border border-slate-700 h-full opacity-95">
            <div class="h-1/2 border-b-2 border-slate-700 pb-2 flex flex-col">
                <p class="text-sm font-bold text-slate-300 text-center mb-2">Points de progression</p>
                <div class="flex-1 relative">
                    <canvas id="ratingChart"></canvas>
                </div>
            </div>
            <div class="flex-1 overflow-y-auto">
               <div class="flex justify-between items-center border-b border-slate-700 pb-1 mb-2">
                   <p class="text-sm font-bold text-slate-300">Historique</p>
                   <button onclick="resetStats()" class="text-xs bg-red-900/50 text-red-400 px-2 py-1 rounded hover:bg-red-800">Reset</button>
               </div>
               <ul class="text-sm space-y-2" id="history-list"></ul>
            </div>
        </div>

        <!-- ZONE CENTRALE : Transparente -->
        <div class="flex-1"></div>

        <!-- PANNEAU DROIT : Stats et Deck -->
        <div class="w-80 bg-slate-800 shadow-xl rounded-lg p-4 flex flex-col gap-4 border border-slate-700 h-full opacity-95">
            
            <div class="bg-slate-900 p-3 rounded border border-slate-700 text-sm">
                <div class="flex justify-between font-bold text-lg mb-2 border-b border-slate-700 pb-2">
                    <span>Rating</span>
                    <span class="text-purple-400" id="current-rating">0 pt</span>
                </div>
                <div class="flex justify-between font-bold">
                    <span>V / D</span>
                    <span><span class="text-green-500" id="wins-count">0W</span> - <span class="text-red-500" id="losses-count">0L</span></span>
                </div>
                <div class="flex justify-between font-bold mt-1">
                    <span>Winrate</span>
                    <span class="text-purple-300" id="winrate-pct">0.0%</span>
                </div>
            </div>

            <div class="flex justify-between gap-2 mt-2">
                <button onclick="addWin()" class="flex-1 bg-green-600 hover:bg-green-500 text-white font-bold py-3 px-2 rounded shadow transition">Victoire</button>
                <button onclick="addLoss()" class="flex-1 bg-red-600 hover:bg-red-500 text-white font-bold py-3 px-2 rounded shadow transition">Défaite</button>
            </div>

            <div class="mt-4 flex-1 overflow-y-auto">
                <p class="text-sm font-bold text-slate-300 mb-2 border-b border-slate-700 pb-1">Deck Utilisé</p>
                <div class="grid grid-cols-4 gap-2" id="dashboard-deck-container">
                    <!-- Les vraies images s'afficheront ici -->
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
