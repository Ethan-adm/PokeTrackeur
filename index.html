<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- LA LIGNE MAGIQUE QUI DÉBLOQUE LES IMAGES SEREBII -->
    <meta name="referrer" content="no-referrer">
    <title>TCGP Tracker - Matchs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-indigo-950 to-slate-900 text-white h-screen flex flex-col font-sans overflow-hidden">
    
    <nav class="bg-black/40 backdrop-blur-md p-4 flex justify-between items-center border-b border-white/10">
        <div class="flex items-center gap-3">
            <div class="w-3 h-3 rounded-full bg-indigo-500 animate-pulse"></div>
            <h1 class="font-black text-2xl tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-purple-500">POCKET TRACKER</h1>
        </div>
        <div class="flex gap-4">
            <a href="index.html" class="bg-indigo-600/20 text-indigo-400 border border-indigo-500/50 px-5 py-2 rounded-lg font-bold">Tracker Actif</a>
            <a href="deck.html" class="bg-white/5 hover:bg-white/10 border border-white/10 px-5 py-2 rounded-lg font-bold transition">Mes Decks (Meta)</a>
        </div>
    </nav>

    <div class="flex justify-between h-full max-w-[1600px] w-full mx-auto gap-6 p-6">
        
        <div class="w-80 bg-black/50 backdrop-blur-xl shadow-2xl rounded-2xl p-5 flex flex-col border border-white/10">
            <p class="text-xs font-bold text-slate-400 uppercase tracking-widest text-center mb-3">Master Ball Rank</p>
            <div class="h-48 relative mb-4">
                <canvas id="ratingChart"></canvas>
            </div>
            <div class="flex-1 overflow-y-auto custom-scrollbar border-t border-white/10 pt-4">
               <div class="flex justify-between items-center mb-3">
                   <p class="text-xs font-bold text-slate-400 uppercase tracking-widest">Historique</p>
                   <button onclick="resetStats()" class="text-[10px] bg-red-500/20 text-red-400 border border-red-500/30 px-2 py-1 rounded">RESET</button>
               </div>
               <ul class="text-sm space-y-2" id="history-list"></ul>
            </div>
        </div>

        <div class="flex-1 bg-black/30 backdrop-blur-xl shadow-2xl rounded-2xl p-8 flex flex-col border border-white/10 relative">
            <div class="flex justify-center mb-8">
                <div class="bg-gradient-to-br from-orange-500 to-red-600 p-1 rounded-2xl shadow-[0_0_20px_rgba(239,68,68,0.2)]">
                    <div class="bg-black/90 rounded-xl px-8 py-4 flex flex-col items-center">
                        <div class="flex items-center gap-3 mb-1">
                            <span class="text-3xl">🔥</span>
                            <span class="text-white font-bold text-xl uppercase tracking-widest">Série de Victoires : <span id="streak-counter" class="text-orange-400 text-3xl">0</span></span>
                        </div>
                        <span class="text-sm text-slate-400 font-bold" id="next-win-points">Prochaine victoire : +10 pt</span>
                    </div>
                </div>
            </div>

            <div class="mb-auto">
                <label class="text-sm font-bold text-slate-300 uppercase tracking-widest mb-4 block text-center">Deck Adverse (Matchup)</label>
                <div class="grid grid-cols-5 gap-3" id="opponent-selector"></div>
            </div>

            <div class="flex gap-4 mt-8 pt-8 border-t border-white/10">
                <button onclick="resolveMatch('win')" class="flex-1 bg-gradient-to-t from-emerald-600 to-emerald-400 hover:to-emerald-300 text-white font-black text-2xl py-6 rounded-xl shadow-[0_0_20px_rgba(52,211,153,0.2)] transition-transform hover:scale-[1.02]">VICTOIRE</button>
                <button onclick="resolveMatch('loss')" class="flex-1 bg-gradient-to-t from-rose-600 to-rose-400 hover:to-rose-300 text-white font-black text-2xl py-6 rounded-xl shadow-[0_0_20px_rgba(251,113,133,0.2)] transition-transform hover:scale-[1.02]">DÉFAITE</button>
            </div>
        </div>

        <div class="w-80 bg-black/50 backdrop-blur-xl shadow-2xl rounded-2xl p-5 flex flex-col border border-white/10">
            <div class="bg-black/60 p-4 rounded-xl border border-white/5 mb-4">
                <div class="flex justify-between items-end mb-3 border-b border-white/10 pb-3">
                    <span class="text-slate-400 text-sm font-bold uppercase tracking-wider">Rating</span>
                    <span class="text-3xl font-black text-indigo-400" id="current-rating">0</span>
                </div>
                <div class="flex justify-between font-bold text-sm mb-1">
                    <span class="text-slate-400">Total (V / D)</span>
                    <span><span class="text-emerald-400" id="wins-count">0W</span> <span class="text-slate-600">|</span> <span class="text-rose-400" id="losses-count">0L</span></span>
                </div>
                <div class="flex justify-between font-bold text-sm">
                    <span class="text-slate-400">Winrate global</span>
                    <span class="text-indigo-300" id="winrate-pct">0.0%</span>
                </div>
            </div>

            <div class="flex-1 overflow-y-auto custom-scrollbar">
                <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-3 text-center">Mon Deck (Importé)</p>
                <div class="grid grid-cols-4 gap-1" id="dashboard-deck-container"></div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
