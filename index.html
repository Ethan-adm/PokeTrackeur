<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCGP Tracker - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-purple-900 to-slate-900 text-white h-screen flex flex-col font-sans overflow-hidden selection:bg-fuchsia-500 selection:text-white">
    
    <!-- Barre de Navigation -->
    <nav class="bg-black/30 backdrop-blur-md p-4 flex justify-between items-center border-b border-white/10 shadow-[0_4px_30px_rgba(0,0,0,0.1)]">
        <div class="flex items-center gap-3">
            <div class="w-3 h-3 rounded-full bg-fuchsia-500 shadow-[0_0_10px_#d946ef] animate-pulse"></div>
            <h1 class="font-black text-2xl tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-fuchsia-400 to-purple-600">TCGP TRACKER</h1>
        </div>
        <div class="flex gap-4">
            <a href="index.html" class="bg-fuchsia-600/20 text-fuchsia-400 border border-fuchsia-500/50 hover:bg-fuchsia-600 hover:text-white px-5 py-2 rounded-lg font-bold transition shadow-[0_0_15px_rgba(217,70,239,0.2)]">Tracker</a>
            <a href="deck.html" class="bg-white/5 hover:bg-white/10 border border-white/10 px-5 py-2 rounded-lg font-bold transition">Éditeur de Deck</a>
        </div>
    </nav>

    <div class="flex justify-between h-full max-w-[1600px] w-full mx-auto gap-6 p-6">
        
        <!-- PANNEAU GAUCHE : Graphique & Historique -->
        <div class="w-80 bg-black/40 backdrop-blur-xl shadow-2xl rounded-2xl p-5 flex flex-col gap-4 border border-white/10 h-full">
            <div class="h-1/2 border-b border-white/10 pb-4 flex flex-col">
                <p class="text-xs font-bold text-slate-400 uppercase tracking-widest text-center mb-3">Progression Rank</p>
                <div class="flex-1 relative">
                    <canvas id="ratingChart"></canvas>
                </div>
            </div>
            <div class="flex-1 overflow-y-auto pr-2 custom-scrollbar">
               <div class="flex justify-between items-center mb-3">
                   <p class="text-xs font-bold text-slate-400 uppercase tracking-widest">Historique</p>
                   <button onclick="resetStats()" class="text-[10px] bg-red-500/20 text-red-400 border border-red-500/30 px-2 py-1 rounded hover:bg-red-500 hover:text-white transition">RESET</button>
               </div>
               <ul class="text-sm space-y-2" id="history-list"></ul>
            </div>
        </div>

        <!-- ZONE CENTRALE : Transparente pour le stream -->
        <div class="flex-1"></div>

        <!-- PANNEAU DROIT : Stats et Deck -->
        <div class="w-80 bg-black/40 backdrop-blur-xl shadow-2xl rounded-2xl p-5 flex flex-col gap-4 border border-white/10 h-full">
            
            <!-- Statistiques -->
            <div class="bg-black/50 p-4 rounded-xl border border-white/5 relative overflow-hidden">
                <div class="absolute -right-4 -top-4 w-16 h-16 bg-fuchsia-500/20 rounded-full blur-2xl"></div>
                <div class="flex justify-between items-end mb-3 border-b border-white/10 pb-3">
                    <span class="text-slate-400 text-sm font-bold uppercase tracking-wider">Rating</span>
                    <span class="text-3xl font-black text-fuchsia-400" id="current-rating">0</span>
                </div>
                <div class="flex justify-between font-bold text-sm mb-1">
                    <span class="text-slate-400">Ratio (V / D)</span>
                    <span><span class="text-emerald-400" id="wins-count">0W</span> <span class="text-slate-600">|</span> <span class="text-rose-400" id="losses-count">0L</span></span>
                </div>
                <div class="flex justify-between font-bold text-sm">
                    <span class="text-slate-400">Winrate</span>
                    <span class="text-purple-300" id="winrate-pct">0.0%</span>
                </div>
            </div>

            <!-- Boutons -->
            <div class="flex justify-between gap-3 mt-1">
                <button onclick="addWin()" class="flex-1 bg-gradient-to-t from-emerald-600 to-emerald-400 hover:to-emerald-300 text-white font-black text-lg py-3 px-2 rounded-xl shadow-[0_0_15px_rgba(52,211,153,0.3)] hover:shadow-[0_0_25px_rgba(52,211,153,0.5)] transition-all transform hover:-translate-y-1">VICTOIRE</button>
                <button onclick="addLoss()" class="flex-1 bg-gradient-to-t from-rose-600 to-rose-400 hover:to-rose-300 text-white font-black text-lg py-3 px-2 rounded-xl shadow-[0_0_15px_rgba(251,113,133,0.3)] hover:shadow-[0_0_25px_rgba(251,113,133,0.5)] transition-all transform hover:-translate-y-1">DÉFAITE</button>
            </div>

            <!-- Decklist -->
            <div class="mt-2 flex-1 overflow-y-auto pr-2 custom-scrollbar">
                <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-3 text-center">Deck Utilisé</p>
                <div class="grid grid-cols-4 gap-2" id="dashboard-deck-container">
                    <!-- Images injectées ici -->
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
