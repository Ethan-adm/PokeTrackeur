<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon TCGP Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-blue-50 h-screen p-4 font-sans overflow-hidden">
    
    <div class="flex justify-between h-full max-w-[1600px] mx-auto gap-4">
        
        <!-- PANNEAU GAUCHE : Graphique -->
        <div class="w-80 bg-white shadow-md rounded-lg p-4 flex flex-col gap-4 border border-gray-200 h-full opacity-90">
            <div class="h-1/2 border-b-2 border-gray-100 pb-2 flex flex-col">
                <p class="text-sm font-bold text-gray-600 text-center mb-2">Points de progression</p>
                <div class="flex-1 relative">
                    <canvas id="ratingChart"></canvas>
                </div>
            </div>
            <div class="flex-1 overflow-y-auto" id="match-history-log">
               <p class="text-sm font-bold text-gray-600 mb-2 border-b pb-1">Historique des Matchs</p>
               <ul class="text-sm space-y-2 text-gray-700" id="history-list">
                 <!-- L'historique s'ajoutera ici -->
               </ul>
            </div>
        </div>

        <!-- ZONE CENTRALE : Catalogue -->
        <div class="flex-1 bg-white shadow-md rounded-lg p-4 flex flex-col border border-gray-200 opacity-95">
            <h2 class="text-lg font-bold text-gray-700 mb-2 border-b pb-2">Catalogue de cartes (Cliquez pour ajouter)</h2>
            <div class="grid grid-cols-4 md:grid-cols-5 gap-3 overflow-y-auto p-2" id="card-catalog"></div>
            <div class="mt-4 pt-2 border-t flex justify-between">
                <button onclick="clearDeck()" class="bg-red-100 text-red-600 px-4 py-2 rounded font-bold hover:bg-red-200">Vider le deck</button>
                <span class="font-bold text-gray-600" id="deck-count">0 / 20 Cartes</span>
            </div>
        </div>

        <!-- PANNEAU DROIT : Stats et Deck -->
        <div class="w-80 bg-white shadow-md rounded-lg p-4 flex flex-col gap-4 border border-gray-200 h-full opacity-90">
            
            <!-- Encart Statistiques -->
            <div class="bg-gray-50 p-3 rounded border border-gray-200 text-sm">
                <div class="flex justify-between font-bold text-lg mb-2 border-b pb-2">
                    <span>Rating</span>
                    <span class="text-purple-700" id="current-rating">3493 pt</span>
                </div>
                <div class="flex justify-between font-bold">
                    <span>V / D</span>
                    <span>
                        <span class="text-green-500" id="wins-count">4W</span> - 
                        <span class="text-red-500" id="losses-count">1L</span>
                    </span>
                </div>
                <div class="flex justify-between font-bold mt-1">
                    <span>Winrate</span>
                    <span class="text-green-600" id="winrate-pct">80.0%</span>
                </div>
            </div>

            <!-- Boutons d'action -->
            <div class="flex justify-between gap-2 mt-2">
                <button onclick="addWin()" class="flex-1 bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-2 rounded shadow transition">Victoire</button>
                <button onclick="addLoss()" class="flex-1 bg-red-500 hover:bg-red-600 text-white font-bold py-2 px-2 rounded shadow transition">Défaite</button>
            </div>

            <!-- Decklist -->
            <div class="mt-4 flex-1 overflow-y-auto">
                <p class="text-sm font-bold text-gray-600 mb-2 border-b pb-1">Deck Actuel</p>
                <div class="grid grid-cols-4 gap-1" id="deck-container"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
