<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon TCGP Tracker</title>
    <!-- Chargement de Tailwind CSS pour le design -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chargement de Chart.js pour le graphique -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-blue-50 h-screen p-4 font-sans overflow-hidden">
    
    <div class="flex justify-between h-full max-w-[1600px] mx-auto gap-4">
        
        <!-- PANNEAU GAUCHE : Graphique et Notes -->
        <div class="w-80 bg-white shadow-md rounded-lg p-4 flex flex-col gap-4 border border-gray-200 h-full">
            <div class="h-1/2 border-b-2 border-gray-100 pb-2 flex flex-col">
                <p class="text-sm font-bold text-gray-600 text-center mb-2">Points de progression</p>
                <div class="flex-1 relative">
                    <!-- Graphique généré par script.js -->
                    <canvas id="ratingChart"></canvas>
                </div>
            </div>
            <div class="flex-1 overflow-y-auto">
               <p class="text-sm font-bold text-gray-600 mb-2 border-b pb-1">Notes / Chat (Simulation)</p>
               <ul class="text-sm space-y-3 text-gray-700">
                 <li><strong>@Joueur1 :</strong> Bonne chance !</li>
                 <li><strong>@Joueur2 :</strong> Joli deck.</li>
               </ul>
            </div>
        </div>

        <!-- ZONE CENTRALE : Transparente pour ton stream / jeu -->
        <div class="flex-1"></div>

        <!-- PANNEAU DROIT : Statistiques et Decklist -->
        <div class="w-80 bg-white shadow-md rounded-lg p-4 flex flex-col gap-4 border border-gray-200 h-full">
            
            <!-- Encart Statistiques -->
            <div class="bg-gray-50 p-3 rounded border border-gray-200 text-sm">
                <div class="flex justify-between font-bold text-lg mb-1">
                    <span>Rating Actuel</span>
                    <span class="text-purple-700" id="current-rating">3493 pt</span>
                </div>
                <div class="flex justify-between text-green-600 font-bold mb-3 border-b pb-2">
                    <span>Variation</span>
                    <span id="rating-change">+39 pt</span>
                </div>
                <div class="flex justify-between font-bold">
                    <span>V / N / D</span>
                    <span>
                        <span class="text-green-500" id="wins">4W</span> - 
                        <span class="text-gray-500" id="draws">0D</span> - 
                        <span class="text-red-500" id="losses">1L</span>
                    </span>
                </div>
                <div class="flex justify-between font-bold mt-1">
                    <span>Winrate</span>
                    <span class="text-green-600" id="winrate">80.00%</span>
                </div>
            </div>

            <!-- Boutons d'action -->
            <div class="flex justify-between gap-2 mt-2">
                <button class="flex-1 bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-2 rounded shadow transition">Victoire</button>
                <button class="flex-1 bg-slate-400 hover:bg-slate-500 text-white font-bold py-2 px-2 rounded shadow transition">Égalité</button>
                <button class="flex-1 bg-red-500 hover:bg-red-600 text-white font-bold py-2 px-2 rounded shadow transition">Défaite</button>
            </div>

            <!-- Decklist visuelle -->
            <div class="mt-4 flex-1 overflow-y-auto">
                <p class="text-sm font-bold text-gray-600 mb-2 border-b pb-1">Deck Actuel</p>
                <div class="grid grid-cols-4 gap-1" id="deck-container">
                    <!-- Les cartes seront générées ici par le JS -->
                </div>
            </div>
        </div>
    </div>

    <!-- Lien vers notre fichier logique -->
    <script src="script.js"></script>
</body>
</html>
